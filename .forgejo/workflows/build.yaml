name: Build and Publish Container

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

env:
  REGISTRY_HOST: registry.onstackit.cloud
  IMAGE_NAME: registry.onstackit.cloud/pan-spielwiese/pan-spielwiese

jobs:
  build-and-push:
    name: Build and Push Docker Container
    runs-on: stackit-ubuntu-24
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to STACKIT Container Registry
        env:
          DOCKER_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          DOCKER_REGISTRY: ${{ secrets.REGISTRY_URL }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" -u "$DOCKER_USERNAME" --password-stdin

      - name: Build and tag Docker image
        run: |
          docker build \
            -t "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            -t "${{ env.IMAGE_NAME }}:latest" \
            .

      - name: Push Docker image to Registry
        run: |
          docker push "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker push "${{ env.IMAGE_NAME }}:latest"

      - name: Log out from Registry
        if: always()
        run: docker logout registry.onstackit.cloud

