name: Build and Test Container

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Docker Container
    runs-on: stackit-ubuntu-24
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t pan-spielwiese:${{ github.sha }} .
